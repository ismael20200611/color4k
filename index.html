
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NWEZHYAN - 10 Links</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at top left, #183566, transparent 55%),
    linear-gradient(135deg, #071126, #030714);
}

.container {
  width: min(100%, 850px);
}

header {
  text-align: center;
  margin-bottom: 30px;
}

h1 {
  font-size: clamp(32px, 5vw, 48px);
  margin-bottom: 10px;
}

h1 span {
  color: #22baff;
}

header p {
  color: #b8c5e5;
  font-size: 16px;
}

.line {
  width: 80px;
  height: 5px;
  margin: 20px auto;
  border-radius: 10px;
  background: linear-gradient(90deg, #00baff, #a52cff);
}

.buttons {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.btn {
  min-height: 70px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px;
  border-radius: 17px;
  color: white;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  border: 1px solid #ffffff30;
  box-shadow: 0 8px 20px #0003;
  cursor: pointer;
  transition: transform .2s, filter .2s;
}

.btn:hover {
  transform: translateY(-3px);
  filter: brightness(1.15);
}

.number {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: #ffffff30;
}

.arrow {
  margin-left: auto;
  font-size: 24px;
}

.blue   { background: linear-gradient(120deg,#008cff,#4938f5); }
.purple { background: linear-gradient(120deg,#a13cff,#6428e8); }
.green  { background: linear-gradient(120deg,#0fc878,#008f78); }
.orange { background: linear-gradient(120deg,#ffb000,#ff6a00); }
.red    { background: linear-gradient(120deg,#ff435f,#d90d48); }
.cyan   { background: linear-gradient(120deg,#00c4df,#0877dc); }
.violet { background: linear-gradient(120deg,#a04bff,#5632e9); }
.teal   { background: linear-gradient(120deg,#00caa7,#008f9d); }
.pink   { background: linear-gradient(120deg,#ed36ba,#b415ed); }
.navy   { background: linear-gradient(120deg,#337cff,#4430d8); }

footer {
  text-align: center;
  color: #8fa2ca;
  font-size: 13px;
  margin-top: 28px;
}

@media(max-width:540px) {
  body {
    padding: 18px;
  }

  .buttons {
    grid-template-columns: 1fr;
  }

  .btn {
    min-height: 64px;
  }
}
</style>
</head>

<body>

<main class="container">

  <header>
    <h1>NWEZHYAN <span>4K 10</span> Links</h1>
    <p>Choose a button to open a page</p>
    <div class="line"></div>
  </header>

  <nav class="buttons" id="buttons"></nav>

  <footer>© 2026 NWEZHYAN</footer>

</main>

<script>
const colors = [
  "blue", "purple", "green", "orange", "red",
  "cyan", "violet", "teal", "pink", "navy"
];

const words = [
  "One", "Two", "Three", "Four", "Five",
  "Six", "Seven", "Eight", "Nine", "Ten"
];

const buttons = document.getElementById("buttons");

for (let i = 1; i <= 10; i++) {
  const button = document.createElement("a");

  // Page 1 -> 1.html, Page 2 -> 2.html ... Page 10 -> 10.html
  button.href = i + ".html";
  button.className = "btn " + colors[i - 1];

  button.innerHTML = `
    <span class="number">${String(i).padStart(2, "0")}</span>
    <span>Page ${words[i - 1]}</span>
    <span class="arrow">→</span>
  `;

  buttons.appendChild(button);
}
</script>

</body>
</html>
